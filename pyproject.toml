[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kalman-timeseries"
version = "0.1.0"
description = "A NumPy-only Kalman filter for denoising and forecasting noisy time series."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["kalman"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
